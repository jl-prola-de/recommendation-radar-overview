name: Domainfactory isolierte Website-Testversion
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/release-requests/**'
permissions:
  contents: read
jobs:
  test-upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build
        run: |
          npm install --no-audit --no-fund
          VITE_PREVIEW_BASEPATH=/github-test/website-preview npm run build
          test -s .output/public/index.html
          test -d .output/public/assets
      - name: Isolierte Testpfade setzen
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path(".output/public")
          html=root/"index.html"
          content=html.read_text()
          content=re.sub(r'(?<=["\'])/assets/', '/github-test/website-preview/assets/', content)
          content=re.sub(r'(?<=["\'])/favicon.ico', '/github-test/website-preview/favicon.ico', content)
          html.write_text(content)
          redirect = """<script>if(location.pathname.endsWith('/index.html')){location.replace(location.pathname.slice(0,-10)+location.search+location.hash)}</script>"""
          content=html.read_text()
          assert "</head>" in content, "HTML head missing"
          html.write_text(content.replace("</head>",redirect+"</head>",1))
          print("Exact index.html browser redirect installed")
          print("Preview asset paths adjusted")
          PY
      - name: FTPS client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
      - name: Upload nur in isolierten Testordner
        env:
          HOST: ${{ secrets.DF_FTPS_HOST }}
          USERNAME: ${{ secrets.DF_FTPS_USER }}
          PASSWORD: ${{ secrets.DF_FTPS_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$USERNAME" && test -n "$PASSWORD"
          cat > /tmp/df-ftps-pinned.pem <<'CERT'
